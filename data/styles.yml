# Avatar Style Definitions
#
# Single source of truth for all supported avatar styles.
#
# Fields:
#   id                    — machine identifier used in API calls and FE state
#   name                  — display label shown in the UI
#   description           — one-sentence style summary
#   key_technical_traits  — rendering characteristics (reference for prompt engineering)
#                           Rules: 
#                             1. no background color
#                             2. no negative instructions
#                             3. no brand names
#   closest_reference     — real-world style anchor
#   system_prompt         — injected verbatim as the image model system prompt.
#                           Covers portrait rendering only — background and framing
#                           are added programmatically by the pipeline.
#                           null = no style override (model decides).
#   example_images        — paths relative to project root (assets/avatar_styles/)

styles:
  - id: random
    name: Random
    description: No fixed style — the image model picks its own visual interpretation.
    key_technical_traits: []
    closest_reference: null
    system_prompt: null
    example_images: []

  - id: studio_3d
    name: 3D Animation
    description: Fully 3D rendered with physically-based lighting, multi-point specular highlights, fine strand-level hair detail, and exaggerated cartoon expressions.
    key_technical_traits:
      - Dramatic CG lighting with visible blue/cool-toned rim or back light on hair and shoulders
      - Large rounded eyes with bright multi-point specular catchlights — eyes clearly larger than realistic
      - Volumetric hair rendered in distinct curved clusters with ambient occlusion and strand-level sheen
      - Smooth skin with soft specular highlight on forehead and cheekbones — no pink/rosy cheek blush
      - Exaggerated head-to-body ratio approximately 1.5:1 — head larger than realistic
      - Rich tonal range per area — skin uses 5+ tones (base, light shadow, deep shadow in creases, soft highlight, bright specular); hair uses 4+ tones (base, AO shadow, mid sheen, bright specular strip)
    closest_reference: High-quality 3D animated feature film characters
    system_prompt: |
      3D rendered portrait avatar, high-quality CG animation style, physically-based rendering.
      Subsurface scattering on skin. Exaggerated head-to-body ratio 1.5:1. Large rounded expressive eyes with multi-point specular catchlights and detailed iris.
      Volumetric hair in distinct curved clusters with ambient occlusion and visible strand-level sheen. Smooth glossy skin with soft specular on forehead and cheekbones.
      Rich tonal range: skin uses 5+ tones (base, light shadow, deep shadow in creases, soft highlight, bright specular); hair uses 4+ tones (base, AO shadow, mid sheen, bright specular strip).
      Soft three-point lighting: warm key from front-above, cool fill from opposite side, subtle rim on hair.
      Render the facial expression exactly as described in the expression section. Do not add or amplify toward smiling, raised brows, or any positive emotion by default.
    example_images:
      - assets/avatar_styles/avatar_style_studio_3d_male.png
      - assets/avatar_styles/avatar_style_studio_3d_female.png
      - assets/avatar_styles/avatar_style_studio_3d_non_binary.png

  - id: korean
    name: Korean Cartoon
    description: 2D digital Korean-style illustration with anime influence, no silhouette outline, semi-realistic proportions, and full highlight-plus-shadow rendering on skin, eyes, and hair.
    key_technical_traits:
      - No outline on the silhouette — shapes defined by adjacent flat color areas meeting each other
      - Semi-realistic facial proportions — slim elongated face shape, almond-shaped eyes moderately large with pronounced detail
      - Fine details rendered — individual eyelashes visible, hair shown in layered overlapping vector strand shapes
      - "3–4 tones per area — skin: base + 1 shadow (jaw/neck) + 1–2 highlight tones (forehead, cheekbone); hair: base + 1–2 tones + 1 specular highlight strip; eyes: base + 2 specular highlight dots"
      - Pale or light-toned skin with subtle warmth — faint delicate complexion, not saturated
      - Shiny glossy hair — strong specular highlight strip or sheen on top of hair mass; shiny wet-look eyes with bright catchlights
    closest_reference: 2D digital illustration / light anime character design
    system_prompt: |
      2D digital illustration, Korean style with anime influence.
      No silhouette outline — shape separation by adjacent flat color areas only. Semi-realistic facial proportions: slim elongated face, almond-shaped eyes moderately large with fine detail.
      Fine details present — individual eyelashes, layered swept vector hair strands in 2–3 tones.
      3–4 tones per area: skin uses base + 1 shadow (jaw/neck) + 1–2 highlight tones (forehead, cheekbone); hair uses base + 1–2 tones + 1 bright specular highlight strip; eyes use base + 2 specular highlight dots (one large, one small).
      Pale or light-toned skin — faint delicate complexion, not heavily saturated. Shiny glossy hair with a strong specular highlight strip along the top; shiny bright catchlights on eyes.
      Render the facial expression exactly as described in the expression section. Faithfully reproduce the brow configuration (raised, furrowed, or oblique as specified) and the iris/pupil position (gaze direction offset) using the fine eye and brow detail this style supports. Do not amplify toward smiling or open mouth by default.
      Clean white or very light background for easy separation.
    example_images:
      - assets/avatar_styles/avatar_style_korean_male.png
      - assets/avatar_styles/avatar_style_korean_female.png
      - assets/avatar_styles/avatar_style_korean_non_binary.png

  - id: photorealistic
    name: Photo-Realistic
    description: Full photographic realism — natural skin texture, accurate lighting with subsurface scattering, anatomically correct proportions, shallow DoF.
    key_technical_traits:
      - Natural skin texture with visible pores and subtle imperfections
      - Physically accurate lighting with single-point catchlights and visible subsurface scattering
      - Anatomically correct facial proportions — realistic eye size, nose, and jaw
      - Shallow depth of field — sharp focus on eyes, soft bokeh on background and ears
    closest_reference: Professional portrait photography / corporate headshot
    system_prompt: |
      Photorealistic professional portrait photograph. No stylization, illustration, or cartoon elements.
      Natural skin with visible pores, subtle texture, and fine hair detail. Physically accurate three-point portrait lighting with natural catchlights and subsurface scattering.
      Anatomically correct facial proportions. Shallow depth of field — sharp focus on eyes, soft bokeh behind subject.
      85mm f/1.8 full-frame DSLR equivalent. Professional corporate headshot quality.
      Neutral medium gray background, sharp contrast with subject.
    example_images:
      - assets/avatar_styles/avatar_style_photorealistic_male.png
      - assets/avatar_styles/avatar_style_photorealistic_female.png
      - assets/avatar_styles/avatar_style_photorealistic_non_binary.png

  - id: lineart
    name: Line Art Sticker
    description: Simple 2D web-illustration with outline strokes, simplified friendly proportions, flat fills with no highlights, and large-scale features only.
    key_technical_traits:
      - Simplified feature rendering — large-scale facial shapes only; fine sub-details such as eyelashes, hair strand lines, and skin texture are absent
      - Each color area uses at most 3 flat shade tones — hair, each clothing item, and face/skin tone each capped at 3 tones; no specular or highlight tones anywhere
      - Simplified friendly proportions — round even face structure, not semi-realistic
      - Rich multi-color palette of 8 or more distinct hues across skin, hair, and clothing
      - Natural expression — face near resting state; emotion is calm and readable without exaggeration
    closest_reference: Sticker pack illustration / web avatar icon
    system_prompt: |
      Simple 2D web illustration portrait, friendly sticker style.
      Outline strokes present on figure edges and facial features.
      Simplified facial features — large-scale shapes only, no fine details like individual eyelashes or hair strand lines.
      Flat fills — each color area (hair, each clothing item, face/skin tone) uses at most 3 flat shade tones; no specular or highlight tones anywhere.
      Simple friendly face proportions — round even face shape, not semi-realistic.
      Render the facial expression exactly as described in the expression section. The brow shape (raised, furrowed, or oblique), iris/pupil gaze direction, and mouth position must be clearly visible as distinct shapes even in simplified flat form.
      Casual clothing in flat solid colors.
      Warm solid-color background for contrast.
    example_images:
      - assets/avatar_styles/avatar_style_lineart_male.png
      - assets/avatar_styles/avatar_style_lineart_female.png
      - assets/avatar_styles/avatar_style_lineart_non_binary.png

  - id: clay
    name: 3D Clay
    description: Smooth 3D render with a matte clay/plastic finish, simplified large-scale features, no fine detail, warm diffuse lighting, and understated expressions.
    key_technical_traits:
      - Prominent warm pink or rosy blush circles on both cheeks — clearly visible, defining the clay/toy aesthetic
      - Matte skin surface — zero specular highlights, no glossy spots on forehead or cheekbones
      - 2–3 flat tones per area — each area (skin, hair, clothing) uses base + at most 1 soft shadow tone; no highlight tones anywhere
      - Warm flat diffuse lighting — even illumination with gentle soft shadows, no dramatic rim light
      - Hair as a simple smooth rounded solid mass — uniform single-tone shape, no strand detail or ambient occlusion
      - Realistic head-to-body proportions — head approximately the same width as the shoulders
      - Simplified large-scale features only — no fine details such as eyelashes, skin pores, or individual hair strands
      - Understated subtle expression — face at or near rest; emotion is soft and minimal, not amplified
    closest_reference: Commercial 3D plastic-clay character pack
    system_prompt: |
      Smooth 3D rendered portrait avatar, commercial plastic-clay character style.
      MATTE clay surface — like molded plastic or clay toy. Zero specular highlights. Flat subsurface-free skin rendering.
      2–3 flat tones per area: each area (skin, hair, clothing) uses base + at most 1 soft shadow tone; no highlight tones anywhere.
      Hair as a simple smooth rounded solid mass — one-tone unified hair shape, no strand detail.
      Warm even diffuse lighting — gentle soft shadows only. No rim light.
      Realistic head-to-body ratio — normal proportions (1:1.5). Normal-sized eyes.
      Simplified large-scale facial features only — no eyelashes, no skin pores, no fine detail.
      Understated expression — face near rest, emotion soft and subtle.
      Solid-color clothing with minimal texture. Neutral light gray or beige background.
    example_images:
      - assets/avatar_styles/avatar_style_clay_male.png
      - assets/avatar_styles/avatar_style_clay_female.png
      - assets/avatar_styles/avatar_style_clay_non_binary.png
