expressions:
- expression: Happiness
  synonyms:
  - Joy
  - Enjoyment
  - Happy
  - Joyful
  - Cheerful
  - Elated
  - Pleased
  facs_action_units: AU6 (marked), AU12 (marked)
  description: 'The Duchenne smile. Cheeks lift strongly, pushing up the lower eyelids
    and producing visible crow''s-feet at the outer eye corners. Lip corners pull
    firmly upward and outward. The eye narrowing from the cheek lift distinguishes
    genuine happiness from a polite smile.

    '
  reexpress:
    method: llm
    llm_params:
      engine: IP-Adapter-FaceID
      prompt_template: "Same person, preserve face and appearance. {expression_name},\
        \ {facs_au_codes}."
      negative_prompt: "deformed, blurry, low quality, wrong expression, distorted\
        \ face, unnatural mouth"
      width: 512
      height: 512
      num_inference_steps: 20
      cfg_scale: 7.0
      ip_adapter_scale: 0.6
      lora: null
      lora_weight: 1.0
- expression: Surprise
  synonyms:
  - Amazement
  - Astonishment
  - Surprised
  - Shocked
  - Alert
  - Startled
  facs_action_units: AU1 (marked), AU2 (marked), AU5 (moderate), AU26 (moderate)
  description: 'Full brow arch — both inner and outer brows raised high, creating
    horizontal forehead lines. Upper lids raised wide. Jaw drops, mouth open. No tension
    anywhere in the face — pure open, unguarded reaction.

