  - Dejected
  facs_action_units: AU1 (moderate), AU4 (slight), AU15 (slight), AU17 (trace)
  description: 'The oblique brow: inner corners raised (AU1), overall brow drawn slightly
    down (AU4), producing a triangular upward-slanted inner brow shape. Lip corners
