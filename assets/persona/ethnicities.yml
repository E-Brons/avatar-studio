# Ethnicity taxonomy for avatar diversity generation
#
# Structure:
#   races        — thin validation buckets used ONLY for DeepFace alignment
#   ethnicities  — the real diversity unit (~45 specific groups)
#   nationality_map   — specific nationality → ethnicity probability distribution
#   regional_defaults — regional group → ethnicity probability distribution (fallback)
#
# Skin tone IDs reference assets/persona/skin_tones.yml  (tone-name/undertone-name)
# Feature weights must reference valid values from phenotype_settings.json

# ── Races (DeepFace validation mapping only) ───────────────────────────────────
races:
  white:
    deepface_race_id: white
  black:
    deepface_race_id: black
  south_asian:
    deepface_race_id: indian
  east_asian:
    deepface_race_id: asian
  southeast_asian:
    deepface_race_id: asian
  middle_eastern:
    deepface_race_id: middle eastern
  latino_hispanic:
    deepface_race_id: latino hispanic

