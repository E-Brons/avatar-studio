# Master Attribute Definitions
#
# Drives the entire UI dynamically — attributes, options, selection modes,
# and inheritance rules all live here, not in code.
#
# Schema per attribute:
#   id           — machine identifier (matches key in demographics/features dicts)
#   label        — display label
#   category     — demographics | phenotype | appearance | advisor
#   type         — choice | integer | color | dual_color | text | list | dict
#   source       — "filename:key_path" or inline options list
#   options      — inline list (used when source is absent)
#   selection_modes — [{id, label}] — available modes for UI
#   default_mode — default selection mode id
#   depends_on   — attribute id this depends on (e.g. "gender" for gender-bucketed attrs)
#   llm_generated — true if this attribute is generated by the LLM (Step B/C)
#   range        — [min, max] for integer type
#   field_names  — [name1, name2] for dual_color type (sub-field names)
#   formula      — derivation formula (for inherited attrs)
#   suggestions  — example values list for text type

attributes:

  # ─── Art Style ────────────────────────────────────────────────────

  - id: style
    label: Art Style
    category: style
    type: choice
    source: "styles.yml:styles"
    selection_modes:
      - id: select
        label: Select
    default_mode: select

  # ─── Demographics ──────────────────────────────────────────────────────────

  - id: gender
    label: Gender
    category: demographics
    type: choice
    options:
      - id: male
        label: Male
      - id: female
        label: Female
      - id: non-binary
        label: Non-Binary
    selection_modes:
      - id: random
        label: Random
      - id: select
        label: Select
    default_mode: random

  - id: pronouns
    label: Pronouns
    category: demographics
    type: choice
    source: "demographics.yml:pronouns"
    depends_on: gender
    selection_modes:
      - id: random
        label: Random
      - id: inherited
        label: Auto (from gender)
      - id: select
        label: Select
    default_mode: inherited

  - id: age
    label: Age
    category: demographics
    type: integer
    range: [0, 110]
    source: "phenotype_settings.json:age_groups"
    selection_modes:
      - id: random
        label: Random
      - id: random_per_group
        label: Random (by group)
      - id: select
        label: Select
    default_mode: random

  - id: nationality
    label: Nationality/Ethnicity
    category: demographics
    type: choice
    source: "demographics.yml:nationality"
    selection_modes:
      - id: random
        label: Random
      - id: select
        label: Select
    default_mode: random

  - id: ethnicity
    label: Ethnicity
    category: demographics
    type: choice
    source: "ethnicities.yml:ethnicities"
    depends_on: nationality
    selection_modes:
      - id: random
        label: Random
      - id: select
        label: Select
    default_mode: random

  - id: religion
    label: Religion
    category: demographics
    type: choice
    source: "demographics.yml:religion"
    selection_modes:
      - id: random
        label: Random
      - id: select
        label: Select
    default_mode: random

  - id: zodiac
    label: Zodiac
    category: personal
    type: choice
    source: "demographics.yml:zodiac"
    selection_modes:
      - id: random
        label: Random
      - id: select
        label: Select
    default_mode: random

  # ─── Phenotype — colors ────────────────────────────────────────────────────

  - id: skin_tone
    label: Skin Tone
    category: phenotype
    type: color
    source: "skin_tones.yml:skin_tones"
    selection_modes:
      - id: random
        label: Random
      - id: llm
        label: Bot
      - id: select
        label: Select
    default_mode: llm

  - id: fitzpatrick_type
    label: Fitzpatrick Type
    category: phenotype
    type: choice
    options:
      - id: I
        label: Type I
      - id: II
        label: Type II
      - id: III
        label: Type III
      - id: IV
        label: Type IV
      - id: V
        label: Type V
      - id: VI
        label: Type VI
    depends_on: skin_tone
    selection_modes:
      - id: random
        label: Random
    default_mode: random

  - id: hair_color
    label: Hair Color
    category: phenotype
    type: dual_color
    source: "phenotype_settings.json:hair_colors"
    field_names: [hex_base, hex_shadow]
    selection_modes:
      - id: random
        label: Random
      - id: llm
        label: Bot
      - id: select
        label: Select
    default_mode: random

  - id: eye_color
    label: Eye Color
    category: phenotype
    type: dual_color
    source: "phenotype_settings.json:eye_colors"
    field_names: [hex_iris, hex_pupil]
    selection_modes:
      - id: random
        label: Random
      - id: llm
        label: Bot
      - id: select
        label: Select
    default_mode: llm

  - id: brows_color
    label: Brows Color
    category: phenotype
    type: color
    source: "phenotype_settings.json:brows_colors"
    selection_modes:
      - id: random
        label: Random
      - id: inherited
        label: Auto (from hair)
      - id: select
        label: Select
      - id: llm
        label: Bot
    default_mode: inherited
    depends_on: hair_color
    formula: "darken_hex_base(factor=0.7)"

  # ─── Phenotype — shapes ────────────────────────────────────────────────────

  - id: eye_shape
    label: Eye Shape
    category: phenotype
    type: choice
    source: "phenotype_settings.json:eye_shapes"
    selection_modes:
      - id: random
        label: Random
      - id: llm
        label: Bot
      - id: select
        label: Select
    default_mode: llm

  - id: brows_style
    label: Brow Style
    category: phenotype
    type: choice
    source: "phenotype_settings.json:brows_styles"
    depends_on: gender
    selection_modes:
      - id: random
        label: Random
      - id: llm
        label: Bot
      - id: select
        label: Select
    default_mode: random

  - id: nose_shape
    label: Nose Shape
    category: phenotype
    type: choice
    source: "phenotype_settings.json:nose_shapes"
    selection_modes:
      - id: random
        label: Random
      - id: llm
        label: Bot
      - id: select
        label: Select
    default_mode: llm

  - id: chin_shape
    label: Chin Shape
    category: phenotype
    type: choice
    source: "phenotype_settings.json:chin_shapes"
    depends_on: gender
    selection_modes:
      - id: random
        label: Random
      - id: llm
        label: Bot
      - id: select
        label: Select
    default_mode: llm

  - id: cheeks_shape
    label: Cheeks Shape
    category: phenotype
    type: choice
    source: "phenotype_settings.json:cheeks_shapes"
    depends_on: gender
    selection_modes:
      - id: random
        label: Random
      - id: llm
        label: Bot
      - id: select
        label: Select
    default_mode: random

  # ─── Appearance — presentation ────────────────────────────────────────────

  - id: hair_style
    label: Hair Style
    category: appearance
    type: choice
    source: "presentation_settings.json:hair_styles"
    depends_on: gender
    llm_generated: true
    selection_modes:
      - id: random
        label: Random
      - id: llm
        label: Bot
      - id: select
        label: Select
    default_mode: llm

  - id: clothing
    label: Clothing
    category: appearance
    type: dict
    source: "presentation_settings.json:clothing_options"
    depends_on: gender
    llm_generated: true
    selection_modes:
      - id: random
        label: Random
      - id: llm
        label: Bot
      - id: select
        label: Select
    default_mode: llm

  - id: accessories
    label: Accessories
    category: appearance
    type: dict
    source: "presentation_settings.json:accessories_options"
    depends_on: gender
    llm_generated: true
    selection_modes:
      - id: random
        label: Random
      - id: llm
        label: Bot
      - id: select
        label: Select
    default_mode: llm

  # ─── Personality ───────────────────────────────────────────────────────────────

  - id: traits
    label: Personality Traits
    category: personality
    type: list
    llm_generated: true
    selection_modes:
      - id: llm
        label: Bot
      - id: select
        label: Select
    default_mode: select
