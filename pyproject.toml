[build-system]
requires = ["setuptools>=70", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "avatar-studio"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "pyyaml>=6.0.0",
    "pillow>=10.0.0",
    "requests>=2.31.0",
    "rembg[cpu]>=2.0.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "sse-starlette>=2.1.0",
]

[project.scripts]
avatar-studio = "api.cli:main"
avatar-style-tuner = "tuning.style_tuner:main"
avatar-expression-tuner = "tuning.expression_tuner:main"
avatar-expression-autotuner = "tuning.expression_autotuner:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["config*", "pipeline*", "api*", "tuning*"]

[tool.setuptools.package-data]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "integration: requires external services (LLM Gateway / Ollama models)",
    "avatar: Avatar Studio feature tests",
    "regression: regression suite (slower, run explicitly)",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
