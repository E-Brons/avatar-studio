[build-system]
requires = ["setuptools>=70", "setuptools-scm"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "avatar-studio"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pyyaml>=6.0.0",
    "pillow>=10.0.0",
    "requests>=2.31.0",
    "rembg[cpu]>=2.0.0",
    "litellm>=1.40.0",
    "python-multipart>=0.0.6",
]

[project.scripts]
avatar-studio = "avatar_studio.api.cli:main"
avatar-style-tuner = "avatar_studio.tuning.style_tuner:main"
avatar-expression-tuner = "avatar_studio.tuning.expression_tuner:main"
avatar-expression-autotuner = "avatar_studio.tuning.expression_autotuner:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["avatar_studio*"]

[tool.setuptools.package-data]
"avatar_studio" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires external services (LLM Gateway / Ollama models)",
    "avatar: Avatar Studio feature tests",
    "regression: regression suite (slower, run explicitly)",
]
