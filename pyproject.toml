[build-system]
requires = ["setuptools>=70", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "avatar-studio"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "ruamel.yaml>=0.18",
    "ruff>=0.4.0",
]

[project.scripts]
avatar-studio = "api.cli:main"
avatar-style-tuner = "tuning.style_tuner:main"
avatar-expression-tuner = "tuning.expression_tuner:main"
avatar-expression-autotuner = "tuning.expression_autotuner:main"
avatar-programmatic-expression-tuner = "tuning.programmatic_expression_tuner:main"

[project.optional-dependencies]
lint = [
]
dev = [
    "cairosvg>=2.7.0",
    "deepface[torch]>=0.0.99",  # [torch] = intent; deepface uses torch backend at runtime
    "fastapi>=0.111.0",
    "httpx>=0.27.0",
    "imagehash>=4.3.0",
    "opencv-python-headless>=4.9.0",
    "pillow>=10.0.0",
    "pytest>=7.0.0",
    "pytest-anyio>=0.0.0",
    "pytest-cov>=5.0.0",
    "pyyaml>=6.0.0",
    "rembg[cpu]>=2.0.0",
    "requests>=2.31.0",
    "sse-starlette>=2.1.0",
    "tensorflow @ file:./vendor/tensorflow-stub",  # stub: satisfies deepface's metadata constraint; real tensorflow unavailable on Python 3.14/arm64
    "torch>=2.3.0",
    "torchvision>=0.18.0",
    "uvicorn[standard]>=0.29.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["config*", "pipeline*", "api*", "tuning*"]

[tool.setuptools.package-data]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "integration: requires external services (LLM Gateway / Ollama models)",
    "avatar: Avatar Studio feature tests",
    "regression: regression suite (slower, run explicitly)",
    "gateway: GatewayClient integration tests",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
