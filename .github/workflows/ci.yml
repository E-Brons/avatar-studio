name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install ruff
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/

  backend-avatar:
    name: Backend · Avatar Studio (unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: vendor/toon-head/package-lock.json

      - name: Install Node vendor dependencies
        run: npm ci
        working-directory: vendor/toon-head

      - name: Install package and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests/ -m "avatar and not integration" -v --tb=short

  frontend-flutter:
    name: Frontend · Flutter Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get
        working-directory: frontend

      - name: Run tests
        run: flutter test
        working-directory: frontend

  integration-avatar:
    name: Integration · Avatar Studio
    runs-on: ubuntu-latest
    if: ${{ vars.OLLAMA_URL != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: vendor/toon-head/package-lock.json

      - name: Install Node vendor dependencies
        run: npm ci
        working-directory: vendor/toon-head

      - name: Install package and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        env:
          OLLAMA_URL: ${{ vars.OLLAMA_URL }}
        run: python -m pytest tests/ -m "avatar and integration" -v --tb=short
