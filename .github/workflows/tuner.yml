name: Expression Autotuner

on:
  workflow_dispatch:
    inputs:
      expression:
        description: "Expression ID(s) to tune (default: all)"
        required: false
        default: "all"
      max_iterations:
        description: "Max refinement iterations per expression"
        required: false
        default: "5"
      pass_threshold:
        description: "Pass threshold (0.0-1.0)"
        required: false
        default: "0.60"

jobs:
  autotuner:
    name: Expression Autotuner
    runs-on: ubuntu-latest
    if: ${{ vars.OLLAMA_URL \!= '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run autotuner
        env:
          OLLAMA_URL: ${{ vars.OLLAMA_URL }}
          EXPRESSION: ${{ inputs.expression }}
          MAX_ITERATIONS: ${{ inputs.max_iterations }}
          PASS_THRESHOLD: ${{ inputs.pass_threshold }}
        run: |
          avatar-expression-autotuner \
            --expression "$EXPRESSION" \
            --max-iterations "$MAX_ITERATIONS" \
            --pass-threshold "$PASS_THRESHOLD"
